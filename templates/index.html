<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cable MES Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .metric-card {
            border-left: 5px solid #007bff;
        }
        .metric-value {
            font-size: 2rem;
            font-weight: bold;
        }
        .alert-card {
            border-left: 5px solid #dc3545;
        }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">🏭 Cable Factory MES</span>
        </div>
    </nav>

    <div class="container">
        <div class="row" id="machines-container">
            {% for machine in machines %}
            <div class="col-md-12 mb-4 machine-card" data-id="{{ machine.id }}">
                <div class="card shadow-sm">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">{{ machine.name }} ({{ machine.type }})</h5>
                        <span class="badge bg-secondary status-badge">LOADING...</span>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <!-- Order Info -->
                            <div class="col-md-3 border-end">
                                <h6 class="text-muted">Active Order</h6>
                                <p class="mb-1"><strong>WO:</strong> <span class="wo-number">-</span></p>
                                <p class="mb-1"><strong>Product:</strong> <span class="product-code">-</span></p>
                                <div class="progress mt-2" style="height: 10px;">
                                    <div class="progress-bar" role="progressbar" style="width: 0%"></div>
                                </div>
                                <small class="text-muted"><span class="produced">0</span> / <span class="target">0</span> m</small>
                            </div>

                            <!-- Live Telemetry -->
                            <div class="col-md-6">
                                <div class="row text-center">
                                    <div class="col-4">
                                        <div class="card p-2 metric-card border-primary">
                                            <small>Speed</small>
                                            <div class="metric-value text-primary"><span class="speed">0</span></div>
                                            <small>m/min</small>
                                        </div>
                                    </div>
                                    <div class="col-4">
                                        <div class="card p-2 metric-card border-warning">
                                            <small>Temp</small>
                                            <div class="metric-value text-warning"><span class="temp">0</span></div>
                                            <small>°C</small>
                                        </div>
                                    </div>
                                    <div class="col-4">
                                        <div class="card p-2 metric-card border-info">
                                            <small>Diameter</small>
                                            <div class="metric-value text-info"><span class="diam">0</span></div>
                                            <small>mm</small>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- OEE & Alerts -->
                            <div class="col-md-3 border-start">
                                <div class="text-center mb-3">
                                    <h6 class="text-muted">OEE</h6>
                                    <h2 class="text-success"><span class="oee">0</span>%</h2>
                                </div>
                                <div class="alert-list small overflow-auto" style="max-height: 100px;">
                                    <!-- Alerts go here -->
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <script>
        function updateDashboard() {
            document.querySelectorAll('.machine-card').forEach(card => {
                const id = card.getAttribute('data-id');
                fetch(`/api/machine/${id}`)
                    .then(response => response.json())
                    .then(data => {
                        // Update Status
                        const badge = card.querySelector('.status-badge');
                        badge.textContent = data.status;
                        badge.className = `badge status-badge ${data.status === 'RUNNING' ? 'bg-success' : 'bg-secondary'}`;

                        // Update WO Info
                        card.querySelector('.wo-number').textContent = data.wo_number;
                        card.querySelector('.product-code').textContent = data.product;
                        card.querySelector('.produced').textContent = data.produced_length;
                        card.querySelector('.target').textContent = data.target_length;

                        // Progress Bar
                        if (data.target_length > 0) {
                            const pct = (data.produced_length / data.target_length) * 100;
                            card.querySelector('.progress-bar').style.width = pct + '%';
                        } else {
                            card.querySelector('.progress-bar').style.width = '0%';
                        }

                        // Telemetry
                        card.querySelector('.speed').textContent = data.speed;
                        card.querySelector('.temp').textContent = data.temperature;
                        card.querySelector('.diam').textContent = data.diameter;

                        // OEE
                        card.querySelector('.oee').textContent = data.oee;

                        // Alerts
                        const alertList = card.querySelector('.alert-list');
                        alertList.innerHTML = '';
                        data.alerts.forEach(alert => {
                            const div = document.createElement('div');
                            div.className = 'text-danger mb-1';
                            div.innerHTML = `<strong>${alert.time}</strong> ${alert.msg}`;
                            alertList.appendChild(div);
                        });
                    });
            });
        }

        setInterval(updateDashboard, 1000);
        updateDashboard();
    </script>
</body>
</html>
