<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cable MES Enterprise</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .sidebar { height: 100vh; position: fixed; top: 0; left: 0; padding-top: 50px; background-color: #343a40; width: 250px; }
        .sidebar a { padding: 15px 25px; text-decoration: none; font-size: 1.1rem; color: #d1d1d1; display: block; }
        .sidebar a:hover { color: #f1f1f1; background-color: #495057; }
        .content { margin-left: 250px; padding: 20px; }
        .navbar-brand { font-weight: bold; }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar d-none d-md-block">
        <h4 class="text-white text-center mb-4">🏭 Cable MES</h4>
        <a href="/admin"><i class="fas fa-tachometer-alt me-2"></i> Dashboard</a>
        <a href="#"><i class="fas fa-industry me-2"></i> Machines & PLC</a>
        <a href="#"><i class="fas fa-clipboard-list me-2"></i> Work Orders</a>
        <a href="#"><i class="fas fa-chart-bar me-2"></i> Reports</a>
        <hr class="text-white">
        <a href="/logout"><i class="fas fa-sign-out-alt me-2"></i> Logout</a>
    </div>

    <!-- Mobile Nav -->
    <nav class="navbar navbar-dark bg-dark d-md-none">
        <div class="container-fluid">
            <span class="navbar-brand">Cable MES</span>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mobileMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="content">
        <nav class="navbar navbar-light bg-light mb-4 shadow-sm rounded">
            <div class="container-fluid">
                <span class="navbar-text">
                    Welcome, <strong>{{ current_user.full_name }}</strong> ({{ current_user.role.value }})
                </span>
            </div>
        </nav>

        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
